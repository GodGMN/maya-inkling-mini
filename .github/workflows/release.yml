name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (leave empty to test the selected ref)
        type: string
      publish:
        description: Publish images and GitHub Release for the selected tag
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/godgmn/tintero

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          tag=$TAG_INPUT
          if [[ -z $tag && $GITHUB_REF_TYPE == tag ]]; then tag=$GITHUB_REF_NAME; fi
          ref=$GITHUB_SHA
          if [[ -n $tag ]]; then
            [[ $tag =~ ^v[A-Za-z0-9_.-]{1,115}$ ]] || exit 1
            if [[ -n $TAG_INPUT ]]; then ref="refs/tags/$tag"; fi
          elif [[ $PUBLISH == true ]]; then
            echo "Publishing requires an existing release tag" >&2
            exit 1
          else
            tag="v0.1.0-test.${GITHUB_SHA:0:12}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, arch: x86_64, backend: cuda, flavor: cuda}
          - {runner: ubuntu-24.04-arm, arch: aarch64, backend: cuda, flavor: cuda}
          - {runner: ubuntu-latest, arch: x86_64, backend: hip, flavor: hip-gfx1100}
    runs-on: ${{ matrix.runner }}
    env:
      STEM: tintero-${{ needs.prepare.outputs.tag }}-linux-${{ matrix.arch }}-${{ matrix.flavor }}
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Free disk space for GPU toolchains
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and archive the Ubuntu binaries
        run: |
          docker buildx build -f "docker/Dockerfile.$BACKEND" --target bundle \
            --output "type=local,dest=$RUNNER_TEMP/bundle" .
          mkdir dist
          tar -C "$RUNNER_TEMP/bundle" -czf "dist/$STEM.tar.gz" .
      - name: Build runtime image
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          FLAVOR: ${{ matrix.flavor }}
          ARCH: ${{ matrix.arch }}
        run: |
          output=type=cacheonly
          if [[ $PUBLISH == true ]]; then
            output="type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          fi
          docker buildx build -f "docker/Dockerfile.$BACKEND" --output "$output" \
            --metadata-file "$RUNNER_TEMP/meta.json" .
          if [[ $PUBLISH == true ]]; then
            jq -er '."containerimage.digest"' "$RUNNER_TEMP/meta.json" > "dist/$FLAVOR-$ARCH.digest"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.arch }}
          path: dist/

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum archives
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt
      - uses: docker/login-action@v3
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image manifests
        if: needs.prepare.outputs.publish == 'true'
        run: |
          for flavor in cuda hip-gfx1100; do
            refs=()
            for digest in dist/"$flavor"-*.digest; do refs+=("$IMAGE@$(cat "$digest")"); done
            docker buildx imagetools create -t "$IMAGE:$TAG-$flavor" -t "$IMAGE:$flavor" "${refs[@]}"
          done
      - uses: softprops/action-gh-release@v2
        if: needs.prepare.outputs.publish == 'true'
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
