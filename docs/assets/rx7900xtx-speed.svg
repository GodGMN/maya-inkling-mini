<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Maya-IK2 RX 7900 XTX Speed Benchmarks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="areaBatch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer card -->
  <rect x="0" y="0" width="960" height="410" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans" font-size="18" font-weight="700" fill="#f8fafc">Inkling-2-Mini (26B MoE) on a Single AMD RX 7900 XTX (24 GB)</text>
  <text x="28" y="58" class="sans" font-size="12" fill="#94a3b8">Native RDNA3 (gfx1100) HIP engine · All 3,072 experts resident in VRAM · 393,216 FP8 context reserved</text>

  <!-- Top KPI Pills -->
  <g transform="translate(28, 74)">
    <rect x="0" y="0" width="214" height="58" rx="10" fill="#131c2e" stroke="#1e293b"/>
    <text x="14" y="25" class="mono" font-size="20" font-weight="700" fill="#fb923c">693.6 <tspan font-size="11" fill="#94a3b8">tok/s</tspan></text>
    <text x="14" y="44" class="sans" font-size="11" fill="#94a3b8">Code Editing (DSpark Drafter)</text>

    <rect x="230" y="0" width="214" height="58" rx="10" fill="#131c2e" stroke="#1e293b"/>
    <text x="244" y="25" class="mono" font-size="20" font-weight="700" fill="#38bdf8">3,365.7 <tspan font-size="11" fill="#94a3b8">tok/s</tspan></text>
    <text x="244" y="44" class="sans" font-size="11" fill="#94a3b8">Uncached Prefill (8,192 tok)</text>

    <rect x="460" y="0" width="214" height="58" rx="10" fill="#131c2e" stroke="#1e293b"/>
    <text x="474" y="25" class="mono" font-size="20" font-weight="700" fill="#2dd4bf">327.8 <tspan font-size="11" fill="#94a3b8">tok/s</tspan></text>
    <text x="474" y="44" class="sans" font-size="11" fill="#94a3b8">Batched Decode (32 streams · 2.8×)</text>

    <rect x="690" y="0" width="214" height="58" rx="10" fill="#131c2e" stroke="#1e293b"/>
    <text x="704" y="25" class="mono" font-size="20" font-weight="700" fill="#a78bfa">0.65 s <tspan font-size="11" fill="#94a3b8">/ img</tspan></text>
    <text x="704" y="44" class="sans" font-size="11" fill="#94a3b8">GPU Vision (vs 14 s CPU · 404 MiB)</text>
  </g>

  <!-- Left Panel: Decode Speed by Depth -->
  <g transform="translate(28, 150)">
    <rect x="0" y="0" width="444" height="236" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="26" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">Single-Stream Decode Speed by Context Depth</text>
    <text x="18" y="43" class="sans" font-size="11" fill="#64748b">IQ4_NL weights · FP8 KV · 393K context reserved (median of 3 runs)</text>

    <!-- Rows (max scale = 125 tok/s -> 240px width) -->
    <!-- Row 1: 32 tok -> 119.2 -->
    <text x="18" y="76" class="sans" font-size="12" fill="#cbd5e1">32 tok prompt</text>
    <rect x="132" y="65" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="65" width="225" height="14" rx="7" fill="url(#barBlue)"/>
    <text x="426" y="76" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#f8fafc">119.2</text>

    <!-- Row 2: 512 tok -> 117.1 -->
    <text x="18" y="106" class="sans" font-size="12" fill="#cbd5e1">512 tok prompt</text>
    <rect x="132" y="95" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="95" width="221" height="14" rx="7" fill="url(#barBlue)"/>
    <text x="426" y="106" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#f8fafc">117.1</text>

    <!-- Row 3: 512 tok + Runtime Abliteration -> 114.6 -->
    <text x="18" y="136" class="sans" font-size="12" font-weight="600" fill="#5eead4">+ Abliteration</text>
    <rect x="132" y="125" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="125" width="216" height="14" rx="7" fill="url(#barCyan)"/>
    <text x="426" y="136" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#5eead4">114.6</text>

    <!-- Row 4: 2,048 tok -> 114.2 -->
    <text x="18" y="166" class="sans" font-size="12" fill="#cbd5e1">2,048 tok prompt</text>
    <rect x="132" y="155" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="155" width="215" height="14" rx="7" fill="url(#barBlue)"/>
    <text x="426" y="166" text-anchor="end" class="mono" font-size="12" fill="#e2e8f0">114.2</text>

    <!-- Row 5: 8,192 tok -> 107.5 -->
    <text x="18" y="196" class="sans" font-size="12" fill="#cbd5e1">8,192 tok prompt</text>
    <rect x="132" y="185" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="185" width="203" height="14" rx="7" fill="url(#barBlue)"/>
    <text x="426" y="196" text-anchor="end" class="mono" font-size="12" fill="#e2e8f0">107.5</text>

    <!-- Row 6: 32,768 tok -> 93.7 -->
    <text x="18" y="224" class="sans" font-size="12" fill="#cbd5e1">32,768 tok prompt</text>
    <rect x="132" y="213" width="236" height="14" rx="7" fill="#1e293b"/>
    <rect x="132" y="213" width="177" height="14" rx="7" fill="url(#barBlue)"/>
    <text x="426" y="224" text-anchor="end" class="mono" font-size="12" fill="#e2e8f0">93.7</text>
  </g>

  <!-- Right Panel: Concurrent Batched Decode Scaling -->
  <g transform="translate(488, 150)">
    <rect x="0" y="0" width="444" height="236" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <text x="18" y="26" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">Concurrent Batch Decode Throughput (tok/s)</text>
    <text x="18" y="43" class="sans" font-size="11" fill="#64748b">Resident batched gfx1100 decoder (IK2_BATCH=32) vs serial baseline</text>

    <!-- Chart plot area: x=54..418 (364px), y=64..194 (130px), maxY=350 tok/s -->
    <!-- Grid lines at 100, 200, 300 -->
    <line x1="54" y1="194" x2="418" y2="194" stroke="#334155" stroke-width="1"/>
    <line x1="54" y1="157" x2="418" y2="157" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="54" y1="120" x2="418" y2="120" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="54" y1="83" x2="418" y2="83" stroke="#1e293b" stroke-dasharray="3,3"/>

    <text x="46" y="198" text-anchor="end" class="mono" font-size="10" fill="#64748b">0</text>
    <text x="46" y="161" text-anchor="end" class="mono" font-size="10" fill="#64748b">100</text>
    <text x="46" y="124" text-anchor="end" class="mono" font-size="10" fill="#64748b">200</text>
    <text x="46" y="87" text-anchor="end" class="mono" font-size="10" fill="#64748b">300</text>

    <!-- X positions: 1->74, 4->160, 8->246, 16->332, 32->408 -->
    <!-- Y = 194 - (val / 350) * 130 -->
    <!-- Batch: (74, 162.7), (160, 124.0), (246, 102.2), (332, 84.6), (408, 72.2) -->
    <!-- Serial: (74, 157.8), (160, 151.2), (246, 150.9), (332, 150.9), (408, 150.9) -->

    <!-- Area under batch curve -->
    <polygon points="74,194 74,162.7 160,124.0 246,102.2 332,84.6 408,72.2 408,194" fill="url(#areaBatch)"/>

    <!-- Serial line -->
    <polyline points="74,157.8 160,151.2 246,150.9 332,150.9 408,150.9" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
    <!-- Batch line -->
    <polyline points="74,162.7 160,124.0 246,102.2 332,84.6 408,72.2" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Data points + labels (Batch) -->
    <circle cx="74" cy="162.7" r="4" fill="#22d3ee" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="160" cy="124.0" r="4" fill="#22d3ee" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="246" cy="102.2" r="4" fill="#22d3ee" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="332" cy="84.6" r="4" fill="#22d3ee" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="408" cy="72.2" r="5" fill="#2dd4bf" stroke="#f8fafc" stroke-width="1.5"/>

    <text x="160" y="114" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#67e8f9">188</text>
    <text x="246" y="92" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#67e8f9">247</text>
    <text x="332" y="75" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#67e8f9">295</text>
    <text x="408" y="61" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#2dd4bf">327.8 tok/s</text>

    <!-- Serial callout -->
    <text x="408" y="143" text-anchor="end" class="mono" font-size="10" fill="#94a3b8">Serial: 116.1 tok/s</text>

    <!-- X axis labels -->
    <text x="74" y="211" text-anchor="middle" class="mono" font-size="10.5" fill="#94a3b8">1 req</text>
    <text x="160" y="211" text-anchor="middle" class="mono" font-size="10.5" fill="#94a3b8">4</text>
    <text x="246" y="211" text-anchor="middle" class="mono" font-size="10.5" fill="#94a3b8">8</text>
    <text x="332" y="211" text-anchor="middle" class="mono" font-size="10.5" fill="#94a3b8">16</text>
    <text x="408" y="211" text-anchor="middle" class="mono" font-size="10.5" fill="#94a3b8">32 reqs</text>

    <!-- Legend -->
    <rect x="18" y="219" width="12" height="3" rx="1.5" fill="#22d3ee"/>
    <text x="35" y="224" class="sans" font-size="10.5" fill="#cbd5e1">Batched (IK2_BATCH=32)</text>
    <line x1="176" y1="220.5" x2="192" y2="220.5" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="198" y="224" class="sans" font-size="10.5" fill="#94a3b8">Serial aggregate</text>
  </g>
</svg>
