name: inkling-2-mini
services:
  llama:
    image: hyperion/maya-ik2:gfx1100-service-r4
    container_name: inkling-2-mini
    restart: unless-stopped
    mem_limit: 10g
    memswap_limit: 10g
    healthcheck:
      start_period: 900s
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    environment:
      IK2_CACHE_SLOTS: "${IK2_CACHE_SLOTS:-1}"
      MAYA_IK2_PRESET: "${MAYA_IK2_PRESET:-}"
    volumes:
      - "${INKLING_MODEL_DIR:-../../models/inkling-2-mini}:/opt/maya/models:ro"
    ports:
      - "8085:8080"
